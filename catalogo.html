<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catálogo | Los Del Sur Accesorios</title>
    <link rel="icon" type="image/png" href="./assets/img/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/reset.css" />
    <link rel="stylesheet" href="./assets/css/variables.css" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>

  <body data-page="catalog">
    <div data-slot="header"></div>

    <main>
      <section id="resultsSection" class="catalog">
        <div class="mobile-filters-overlay" id="mobileFiltersOverlay"></div>

        <aside id="catalogSidebar" class="catalog__sidebar">
          <div class="mobile-filters-sheet__handle"></div>

          <div class="filters-box">
            <div class="filters-box__header">
              <h3 class="filters-box__title">
                <span data-icon="sliders"></span>Filtros
              </h3>
              <div class="filters-box__actions">
                <button
                  id="clearFiltersBtn"
                  class="filters-box__clear"
                  type="button"
                >
                  <span
                    data-icon="close"
                    data-size="12"
                    data-stroke="2.5"
                  ></span
                  >Limpiar
                </button>
                <button
                  id="closeFiltersBtn"
                  class="mobile-filters-close"
                  type="button"
                  aria-label="Cerrar filtros"
                >
                  ✕
                </button>
              </div>
            </div>

            <div class="filter-group">
              <label class="filter-label" for="filterCategory">Categoría</label>
              <div class="filter-select-wrap">
                <select id="filterCategory" class="filter-select"></select>
              </div>
            </div>
            <div class="filter-group">
              <label class="filter-label" for="filterBrand">Marca</label>
              <div class="filter-select-wrap">
                <select id="filterBrand" class="filter-select"></select>
              </div>
            </div>
            <div class="filter-group">
              <label class="filter-label" for="filterModel">Modelo</label>
              <div class="filter-select-wrap">
                <select
                  id="filterModel"
                  class="filter-select"
                  disabled
                ></select>
              </div>
            </div>
            <div class="filter-group" id="filterRimGroup" hidden>
              <label class="filter-label" for="filterRim">Rodado</label>
              <div class="filter-select-wrap">
                <select id="filterRim" class="filter-select"></select>
              </div>
            </div>
          </div>

          <div class="mobile-filters-footer">
            <button
              id="applyFiltersBtn"
              class="mobile-filters-apply"
              type="button"
            >
              Ver Resultados
            </button>
          </div>
        </aside>

        <div class="catalog__content">
          <div class="results__bar">
            <div class="results__bar-left">
              <h1 class="section-title">Resultados</h1>
              <span id="resultsCount" class="results__count"
                >Cargando catálogo…</span
              >
              <button
                class="mobile-filters-btn"
                id="mobileFiltersBtn"
                type="button"
              >
                <span data-icon="sliders"></span>Filtros
              </button>
            </div>
            <div data-slot="results-tools"></div>
          </div>

          <p id="fuzzyBanner" class="grid-notice" hidden></p>
          <div id="productsGrid" class="grid" aria-live="polite"></div>
          <div id="pagination" class="pagination"></div>

          <div id="emptyState" class="empty" hidden>
            <div class="empty__icon">
              <span
                data-icon="searchCircle"
                data-size="48"
                data-stroke="1.2"
              ></span>
            </div>
            <h3 class="empty__title">Sin resultados</h3>
            <p class="empty__text">
              Ajustá los filtros o probá con otros términos de búsqueda.
            </p>
            <button class="empty__reset" id="emptyReset" type="button">
              Ver todo el catálogo
            </button>
          </div>
        </div>
      </section>
    </main>

    <div data-slot="drawer"></div>
    <div data-slot="footer"></div>

    <script type="module" src="./assets/js/main.js"></script>
  </body>
</html>
