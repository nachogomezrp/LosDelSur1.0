<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Tu destino premium para accesorios, repuestos y detalles que elevan tu vehículo al siguiente nivel."
    />
    <title>Los Del Sur Accesorios</title>
    <link rel="icon" type="image/png" href="./assets/img/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      as="image"
      href="./assets/img/hero-espejos.jpg"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="./assets/css/reset.css" />
    <link rel="stylesheet" href="./assets/css/variables.css" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>

  <body data-page="home">
    <div data-slot="header"></div>

    <main>
      <div data-slot="hero"></div>
      <div data-slot="features"></div>

      <section class="catalog catalog--home">
        <div class="catalog__content">
          <div class="results__bar">
            <div class="results__bar-left">
              <h2 class="section-title">Productos destacados</h2>
            </div>
            <div data-slot="results-tools"></div>
          </div>
          <div id="productsGrid" class="grid" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <div data-slot="drawer"></div>
    <div data-slot="footer"></div>

    <script type="module" src="./assets/js/main.js"></script>
  </body>
</html>
